name: CodeMender Wiz Evaluation

on:
  # --- PRODUCTION TRIGGER: PR Merge Only ---
  pull_request:
    types: [closed]

  # --- TESTING TRIGGER: Uncomment below to run on every push/commit or manual trigger ---
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  codemender-evaluation:
    # Runs on manual trigger, push, or when a pull request is merged
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Provider format:
          # projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_NAME/providers/PROVIDER_NAME
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install CodeMender and Google SDK Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-cloud-storage

      - name: Install Google CodeMender Wiz Evaluation Skill
        run: |
          mkdir -p .agents/skills
          if [ ! -d ".agents/skills/codemender-wiz-evaluation-skill" ]; then
            git clone https://github.com/cloud-gtm/codemender-wiz-evaluation-skill.git .agents/skills/codemender-wiz-evaluation-skill || true
          fi
          if [ -f ".agents/skills/codemender-wiz-evaluation-skill/requirements.txt" ]; then
            pip install -r .agents/skills/codemender-wiz-evaluation-skill/requirements.txt
          fi

      - name: Run CodeMender Wiz Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WIZ_API_CLIENT_ID: ${{ secrets.WIZ_API_CLIENT_ID }}
          WIZ_API_CLIENT_SECRET: ${{ secrets.WIZ_API_CLIENT_SECRET }}
        run: |
          echo "Running CodeMender by Wiz Evaluation Skill..."
          if [ -f ".agents/skills/codemender-wiz-evaluation-skill/run.py" ]; then
            python .agents/skills/codemender-wiz-evaluation-skill/run.py --workspace .
          elif [ -f ".agents/skills/codemender-wiz-evaluation-skill/SKILL.md" ]; then
            echo "Executing CodeMender Skill workflow..."
            python -m .agents.skills.codemender_wiz_evaluation_skill --workspace .
          else
            echo "Skill loaded at .agents/skills/codemender-wiz-evaluation-skill"
          fi

      # =========================================================================
